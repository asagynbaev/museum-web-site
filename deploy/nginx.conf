# nginx: статика сайта + проксирование /api на билетный сервер.
# Копируется в /etc/nginx/sites-available/museum, симлинк в sites-enabled.
# ЗАМЕНИТЬ museum.kg на настоящий домен (в трёх местах ниже).
#
# Блок с TLS дописывает certbot:
#   sudo certbot --nginx -d museum.kg -d www.museum.kg

server {
    listen 80;
    listen [::]:80;
    server_name museum.kg www.museum.kg;

    root /opt/museum/dist;
    index index.html;

    # Сайт — SPA: /ticket/AIM-XXXX-XXXX и прочие пути отдаёт index.html,
    # маршрут разбирает уже фронт.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite неизменяемы — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Медиа музея: 40+ МБ картинок и видео, отдаём с кэшем и докачкой.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сервер сам ходит в банк с таймаутом 15 с — даём запас сверху.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
