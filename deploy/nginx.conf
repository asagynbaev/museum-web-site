# nginx: статика сайта + проксирование /api на билетный сервер.
# Копируется в /etc/nginx/sites-available/museum, симлинк в sites-enabled.
# ЗАМЕНИТЬ museum.kg на настоящий домен (в трёх местах ниже).
#
# Блок с TLS дописывает certbot:
#   sudo certbot --nginx -d museum.kg -d www.museum.kg

# Голосовой гид /bars: каждый токен Gemini Live — деньги, поэтому не больше
# 6 в минуту с одного адреса (+4 всплеском). Зона — на уровне http, вне server.
limit_req_zone $binary_remote_addr zone=concierge_token:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name museum.kg www.museum.kg;

    root /opt/museum/dist;
    index index.html;

    # Сайт — SPA: /ticket/AIM-XXXX-XXXX и прочие пути отдаёт index.html,
    # маршрут разбирает уже фронт. index.html браузер перепроверяет каждый раз
    # (ETag, 304): в нём имена хешированных бандлов текущей сборки, а без
    # Cache-Control браузер кэширует его эвристически и показывает старый сайт.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite неизменяемы — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Медиа музея: 40+ МБ картинок и видео, отдаём с кэшем и докачкой.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Модель барса и прочее для /bars. 60 МБ модели отдаём заранее сжатыми
    # (.gz кладёт npm run build); no-cache = каждый раз 304-проверка, так что
    # новая модель приезжает сразу, а старая не качается заново.
    location /concierge/ {
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    # Голосовой гид: токен Gemini Live и тулы — сервер консьержа
    # (concierge-api.service, :8090). Префиксы длиннее /api/ — nginx выбирает их.
    location /api/live/ {
        limit_req zone=concierge_token burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /api/tools/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сервер сам ходит в банк с таймаутом 15 с — даём запас сверху.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
