# Проверка и деплой музея на VPS.
#
# Каждый пуш в main: собираем сайт и поднимаем билетный API на заглушке банка
# (если что-то сломано — до сервера не доходим), потом заходим на VPS по SSH
# и запускаем /usr/local/bin/museum-deploy. Настройка сервера и секретов —
# deploy/README.md, раздел «Автодеплой из GitHub Actions».
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         адрес сервера, например 84.54.12.242
#   DEPLOY_USER         пользователь для деплоя (deploy)
#   DEPLOY_SSH_KEY      приватный ключ деплоя целиком, с BEGIN/END
#   DEPLOY_KNOWN_HOSTS  строка из known_hosts для сервера (защита от подмены)
#   DEPLOY_PORT         необязательно, по умолчанию 22

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два деплоя одновременно не нужны: новый ждёт, пока закончится текущий.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Сборка и проверка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Сайт
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Билетный API на заглушке банка
        working-directory: server
        env:
          DB_PATH: ${{ runner.temp }}/museum-ci.db
        run: |
          npm ci --no-audit --no-fund
          node --env-file=.env.mock src/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/api/tariffs > /dev/null
          curl -fsS http://127.0.0.1:8787/api/slots/calendar > /dev/null
          echo "API поднялся, сеансы отдаются"

      - name: Журнал API при ошибке
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  deploy:
    name: Деплой на VPS
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Проверка секретов
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::warning::Секреты DEPLOY_* не заданы — деплой пропущен. См. deploy/README.md, «Автодеплой»."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH-ключ
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Деплой
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # Команду выбирает сервер (command= в authorized_keys), здесь её не передаём.
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "$USER@$HOST"

      - name: Сайт отвечает
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl -fsS https://museum.eaysdev.online/api/health
          curl -fsS -o /dev/null https://museum.eaysdev.online/
          echo "museum.eaysdev.online живой"
